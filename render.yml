services:
  # ── 1. Backend: API + Mail server
  - type: web
    name: skilimu-server
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4001
      - key: NOTIFY_EMAIL
        value: hello@skilimu.com
      - key: SMTP_HOST
        sync: false # set manually in Render dashboard
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # ── 2. Frontend: Vite static site
  - type: web
    name: skilimu
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
